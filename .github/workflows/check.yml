name: Konaet executable checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.2'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Exercise concurrent deployment startup repeatedly
        run: node tests/startup-stress.mjs 12
      - run: npm run verify
